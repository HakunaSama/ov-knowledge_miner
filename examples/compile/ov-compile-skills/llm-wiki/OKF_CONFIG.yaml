version: "2.0"

frontmatter:
  required:
    - type
    - title
    - description
    - sources
    - generated
  allowed_types:
    - entity
    - concept
    - synthesis
    - index
  sources:
    required_fields:
      - resource
      - title
  generated:
    required_fields:
      - by
      - at
    by_template: "{skill}/{model}"

# The physical tree is the canonical write model. Each promoted candidate becomes one
# independent page. The first three levels are configured taxonomy nodes; subject_path
# represents zero or more optional directories chosen from the page's actual subject.
main_view:
  root_path: knowledge
  path_structure:
    - page_role
    - business_domain
    - subdomain
    - subject_path
    - filename
  page_roles:
    - id: topic
      title: "TOPIC"
      description: "围绕业务对象、能力、系统或主题形成的解释性知识。"
    - id: reference
      title: "REFERENCE"
      description: "适合快速查询的定义、事实、清单、参数、规则或约束。"
    - id: procedure
      title: "PROCEDURE"
      description: "可执行的步骤、流程、SOP、检查表或操作规范。"
    - id: synthesis
      title: "SYNTHESIS"
      description: "跨来源形成的结论、比较、决策、解释或综合洞察。"
  business_domains:
    - id: operations
      title: "运营与履约"
      description: "业务规划、供应链、履约、服务交付与质量管理。"
      subdomains:
        - id: planning
          title: "运营规划"
        - id: supply-chain
          title: "供应链"
        - id: fulfillment
          title: "履约"
        - id: service-delivery
          title: "服务交付"
        - id: quality
          title: "质量管理"
    - id: products-services
      title: "产品与服务"
      description: "产品和服务的组合、设计、定价、生命周期与支持。"
      subdomains:
        - id: portfolio
          title: "产品服务组合"
        - id: design
          title: "产品服务设计"
        - id: pricing
          title: "定价"
        - id: lifecycle
          title: "生命周期"
        - id: support
          title: "产品服务支持"
    - id: customers-markets
      title: "客户与市场"
      description: "客户洞察、市场、营销、销售、渠道与增长。"
      subdomains:
        - id: customer-insight
          title: "客户洞察"
        - id: marketing
          title: "市场营销"
        - id: sales
          title: "销售"
        - id: channels
          title: "渠道"
        - id: growth
          title: "增长"
    - id: technology-data
      title: "技术与数据"
      description: "架构、工程研发、基础设施、安全、数据与人工智能。"
      subdomains:
        - id: architecture
          title: "架构"
        - id: engineering
          title: "工程研发"
        - id: infrastructure
          title: "基础设施"
        - id: security
          title: "信息安全"
        - id: data-ai
          title: "数据与人工智能"
    - id: strategy-finance
      title: "战略与财务"
      description: "战略、公司治理、财务、采购与资产配置。"
      subdomains:
        - id: strategy
          title: "战略"
        - id: governance
          title: "公司治理"
        - id: finance
          title: "财务"
        - id: procurement
          title: "采购"
        - id: assets
          title: "资产管理"
    - id: people-organization
      title: "人才与组织"
      description: "组织设计、岗位角色、人才、学习发展与组织文化。"
      subdomains:
        - id: organization
          title: "组织设计"
        - id: roles
          title: "岗位与角色"
        - id: talent
          title: "人才管理"
        - id: learning
          title: "学习与发展"
        - id: culture
          title: "组织文化"
    - id: legal-compliance-risk
      title: "法务、合规与风险"
      description: "法律事务、合规、风险、审计与隐私保护。"
      subdomains:
        - id: legal
          title: "法律事务"
        - id: compliance
          title: "合规"
        - id: risk
          title: "风险管理"
        - id: audit
          title: "审计"
        - id: privacy
          title: "隐私保护"
    - id: brand-communications
      title: "品牌与传播"
      description: "品牌、企业传播、公共关系、声誉与社会责任。"
      subdomains:
        - id: brand
          title: "品牌"
        - id: communications
          title: "企业传播"
        - id: public-relations
          title: "公共关系"
        - id: reputation
          title: "声誉管理"
        - id: social-responsibility
          title: "社会责任"
  navigation:
    filename: index.md
    type: index
  exempt_paths:
    - "**/index.md"

# Viewable mining artifacts are committed beside the canonical pages. The evidence
# ledger connects every page to both its input evidence and this intermediate chain.
intermediates:
  required: true
  root_path: _mining
  run_manifest: run-manifest.json
  evidence_ledger: evidence-ledger.json
  investigation_report: investigation-report.json
  source_coverage: source-coverage.json
  candidate_knowledge: candidate-knowledge.json
  # These two artifacts are generated and merged by Compile itself so an Agent
  # cannot accidentally erase reading or evidence history in an incremental run.
  readlist: readlist.json
  evidence_history: evidence-history.json

markdown_links:
  enabled: true
  auto_link: true
  catalog_only: true
  first_occurrence_per_paragraph: false
  exclude:
    - headings
    - tables
    - code
