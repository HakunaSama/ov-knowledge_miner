version: "1.2"

frontmatter:
  required:
    - type
    - title
    - description
    - tags
    - status
    - sources
    - generated
    - knowledge_links
  allowed_types:
    - entity
    - concept
    - synthesis
  defaults:
    status: stable
  sources:
    required_fields:
      - resource
      - title
      - author
      - kind
      - stage
    allowed_kinds:
      - original
      - team-memory
      - human-answer
      - intermediate
    require_input: true
    require_intermediate: true
  generated:
    required_fields:
      - by
      - at
    by_template: "{skill}/{model}"

# Rules are applied from top to bottom; the last matching rule wins.
path_types:
  - pattern: "index.md"
    type: synthesis
  - pattern: "knowledge/what/**/*.md"
    type: entity
  - pattern: "knowledge/why/**/*.md"
    type: synthesis
  - pattern: "knowledge/how/**/*.md"
    type: concept

# The physical tree is the canonical write model. Each configured route expands to
# one or more directory levels between the top-level facet and meta_id.
main_view:
  single_source_of_truth: true
  root_path: knowledge
  facet_categories:
    - what
    - why
    - how
  path_structure:
    - facet
    - route
    - meta_id
    - filename
  directory_routes:
    what:
      - products
      - operations
      - technology
    why:
      - compliance
      - management
      - finance
    how:
      - operations/pickup-delivery
      - technology/backend
      - technology/data
      - training/onboarding
  exempt_paths:
    - index.md
  # One meta-knowledge unit is three pages sharing one explicit frontmatter meta_id.
  meta_knowledge:
    group_by: frontmatter_field
    id_field: meta_id
    require_complete: true
    shared_view_tags: true
    require_id_directory: true
  # index.md is navigation, not another knowledge file in derived views.
  derived_views_include_exempt: false

# Viewable mining artifacts are committed beside the canonical pages. The evidence
# ledger connects every page to both its input evidence and this intermediate chain.
intermediates:
  required: true
  root_path: _mining
  run_manifest: run-manifest.json
  evidence_ledger: evidence-ledger.json
  investigation_report: investigation-report.json
  questionnaire: questionnaire.json
  source_coverage: source-coverage.json
  candidate_knowledge: candidate-knowledge.json
  # These two artifacts are generated and merged by Compile itself so an Agent
  # cannot accidentally erase reading or evidence history in an incremental run.
  readlist: readlist.json
  evidence_history: evidence-history.json

# Cross-knowledge-base references are explicit OpenViking URIs. A bidirectional
# relation must be mirrored in the counterpart checkout when that checkout is writable.
cross_knowledge:
  frontmatter_field: knowledge_links
  context_field: context
  require_body_link: true
  allowed_relations:
    - related
    - depends-on
    - derived-from
    - supersedes

# The perspective view is virtual and never duplicates physical pages. Every
# meta-knowledge unit selects exactly one leaf in this two-level hierarchy:
# knowledge form (TOPIC/REFERENCE/PROCEDURE/SYNTHESIS) -> enterprise domain.
views:
  - id: perspective
    title: "企业知识透视图 · Perspective"
    description: "按知识形态与企业知识域两级目录重新组织同一批知识页面。"
    tag_prefix: "view/perspective/"
    selection: exactly_one
    groups:
      - id: topic
        title: "TOPIC"
        description: "围绕业务对象、能力、系统或主题组织的知识。"
        groups: &enterprise_domains
          - id: operations
            title: "operations"
            description: "运营、履约、供应链与日常业务运作。"
          - id: product-service
            title: "product-service"
            description: "产品、服务、项目及其生命周期。"
          - id: customer-market
            title: "customer-market"
            description: "客户、用户、市场、销售与增长。"
          - id: technology-data
            title: "technology-data"
            description: "技术系统、架构、平台、数据与算法。"
          - id: management-finance
            title: "management-finance"
            description: "经营管理、战略、财务与资源配置。"
          - id: people-organization
            title: "people-organization"
            description: "人员、角色、团队、组织与协作关系。"
          - id: compliance-risk
            title: "compliance-risk"
            description: "合规、法律、安全、审计与风险控制。"
          - id: corporate-brand
            title: "corporate-brand"
            description: "企业、品牌、文化、传播与公共形象。"
      - id: reference
        title: "REFERENCE"
        description: "适合按定义、事实、清单、参数或索引快速查询的知识。"
        groups: *enterprise_domains
      - id: procedure
        title: "PROCEDURE"
        description: "可执行的步骤、流程、SOP、检查表与操作规范。"
        groups: *enterprise_domains
      - id: synthesis
        title: "SYNTHESIS"
        description: "跨来源形成的结论、解释、比较、决策与综合洞察。"
        groups: *enterprise_domains

wikilinks:
  enabled: true
  syntax: double-bracket
  auto_link: true
  catalog_only: true
  first_occurrence_per_paragraph: true
  exclude:
    - headings
    - tables
    - code
